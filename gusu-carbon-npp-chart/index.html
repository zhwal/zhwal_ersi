<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图表 4.2 — 姑苏区碳排放与碳汇五年变化对比</title>
<style>
  :root {
    --bg: #F5F0E8;
    --text: #1A1A1A;
    --carbon: #8B4513;
    --npp: #1E3A28;
    --tooltip-bg: rgba(26, 26, 26, 0.95);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: "Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
    background: var(--bg);
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 24px 20px;
    overflow-x: hidden;
  }
  .title {
    font-size: clamp(18px, 2.5vw, 22px); font-weight: 700; color: var(--text);
    text-align: center; margin-bottom: 8px; letter-spacing: 0.4px;
    opacity: 0; transform: translateY(-8px);
    animation: titleIn 0.7s 0.15s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  }
  @keyframes titleIn {
    to { opacity: 1; transform: translateY(0); }
  }
  .chart-wrap {
    position: relative; width: 100%; max-width: 1100px;
    flex: 1; min-height: 380px;
  }
  .legend-wrap {
    display: flex; justify-content: center; gap: 36px; margin-top: 14px;
    flex-shrink: 0; opacity: 0;
    animation: legendIn 0.5s 1.5s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  }
  @keyframes legendIn {
    to { opacity: 1; }
  }
  .legend-item {
    display: flex; align-items: center; gap: 8px; font-size: clamp(12px, 1.5vw, 13.5px);
    font-weight: 500; color: var(--text); user-select: none;
  }
  .legend-dot {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2.5px solid; background: var(--bg);
  }
  .legend-dot.carbon { border-color: var(--carbon); }
  .legend-dot.npp { border-color: var(--npp); }
  .legend-square {
    width: 12px; height: 12px;
    border: 2.5px solid var(--npp); background: var(--bg);
  }
  canvas { display: block; width: 100%; height: 100%; }
  .tooltip {
    position: absolute; pointer-events: none; opacity: 0;
    background: var(--tooltip-bg); color: #fff;
    border-radius: 5px; padding: 10px 14px; font-size: 13px;
    line-height: 1.6; white-space: nowrap;
    transform: translate(-50%, -112%);
    transition: opacity 0.15s;
    z-index: 10; font-family: "Noto Serif SC", "Source Han Serif SC", serif;
  }
  .tooltip::after {
    content: ''; position: absolute; bottom: -5px; left: 50%;
    transform: translateX(-50%);
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-top: 6px solid var(--tooltip-bg);
  }
  .tooltip.show { opacity: 1; }
</style>
</head>
<body>

<div class="title">姑苏区碳排放与碳汇五年变化对比（2019–2023）</div>

<div class="chart-wrap" id="chartWrap">
  <canvas id="chart"></canvas>
  <div class="tooltip" id="tooltip"></div>
</div>

<div class="legend-wrap">
  <div class="legend-item">
    <div class="legend-dot carbon"></div>
    <span>碳排放密度（tCO₂/km²）</span>
  </div>
  <div class="legend-item">
    <div class="legend-square"></div>
    <span>NPP碳汇密度（tCO₂/km²/yr）</span>
  </div>
</div>

<script>
// ============================================================
// 数据
// ============================================================
const YEARS = [2019, 2020, 2021, 2022, 2023];
const carbonData = [31016, 33359, 35196, 33731, 35696];
const nppData    = [1522,  1459,  1569,  1488,  1431];

// ============================================================
// 样式配置
// ============================================================
const FONT_AXIS   = '13.5px "Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", SimSun, serif';
const FONT_LABEL  = '13px "Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", SimSun, serif';
const FONT_POINT  = 'bold 12.5px "Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", SimSun, serif';

const COLORS = {
  carbon:     '#8B4513',
  carbonFill: 'rgba(139, 69, 19, 0.1)',
  carbonGlow: 'rgba(139, 69, 19, 0.18)',
  npp:        '#1E3A28',
  nppFill:    'rgba(30, 58, 40, 0.1)',
  nppGlow:    'rgba(30, 58, 40, 0.18)',
  grid:       '#C5BFB5',
  axis:       '#8C8780',
  text:       '#1A1A1A',
  hoverLine:  '#5A5550'
};

const carbonRange = { min: 30000, max: 36000, step: 1000 };
const nppRange    = { min: 1000,  max: 2000,  step: 200  };

const PAD_BASE = { top: 24, right: 88, bottom: 66, left: 80 };

let W, H, plotL, plotR, plotT, plotB, PAD;
let ctx, canvas, wrap, tooltip;
let hoverIdx = -1;
let animStart = 0;

// ============================================================
// 初始化
// ============================================================
window.onload = function() {
  canvas = document.getElementById('chart');
  ctx = canvas.getContext('2d');
  wrap = document.getElementById('chartWrap');
  tooltip = document.getElementById('tooltip');

  resize();
  bindEvents();
  animStart = performance.now();
  requestAnimationFrame(animLoop);
};

function resize() {
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = rect.width;
  H = rect.height;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const scale = Math.min(1, W / 920);
  PAD = {
    top:    PAD_BASE.top    * scale,
    right:  PAD_BASE.right  * scale,
    bottom: PAD_BASE.bottom * scale,
    left:   PAD_BASE.left   * scale
  };
  plotL = PAD.left;
  plotR = W - PAD.right;
  plotT = PAD.top;
  plotB = H - PAD.bottom;
}

function bindEvents() {
  let raf;
  window.addEventListener('resize', () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => { resize(); draw(1); });
  });
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mouseleave', onMouseLeave);
}

// ============================================================
// 坐标转换
// ============================================================
function xOf(i) { return plotL + (i / (YEARS.length - 1)) * (plotR - plotL); }
function yCarbon(v) { return plotB - ((v - carbonRange.min) / (carbonRange.max - carbonRange.min)) * (plotB - plotT); }
function yNpp(v) { return plotB - ((v - nppRange.min) / (nppRange.max - nppRange.min)) * (plotB - plotT); }

// ============================================================
// 缓动函数
// ============================================================
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t) { const c1 = 1.70158; return 1 + (c1 + 1) * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -10 * t) * Math.sin((t - 1) * (2 * Math.PI) / 0.4) + 1;
}

// ============================================================
// 多阶段动画系统
// ============================================================
// 阶段时间线 (ms)：
//   0-400:    网格 + 轴线淡入
//   300-900:  两条折线绘制
//   700-1300: 数据点依次弹入
//   1000-1400:数据标注依次淡入
function animLoop(ts) {
  const elapsed = ts - animStart;
  const phase = Math.min(1, elapsed / 1500);

  // 网格 & 轴线 alpha
  const gridAlpha = Math.min(1, elapsed / 400);
  // 折线进度
  const lineProg = easeOutCubic(clamp((elapsed - 300) / 600, 0, 1));
  // 数据点进度 (逐个)
  const pointBase = clamp((elapsed - 700) / 600, 0, 1);
  // 标注进度
  const labelBase = clamp((elapsed - 1000) / 400, 0, 1);

  draw(gridAlpha, lineProg, pointBase, labelBase);

  if (phase < 1) {
    requestAnimationFrame(animLoop);
  } else {
    // 动画完成后保持最终状态
    draw(1, 1, 1, 1);
  }
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// 无动画重绘（resize / hover 时）
function draw(gridAlpha, lineProg, pointBase, labelBase) {
  ctx.clearRect(0, 0, W, H);

  drawGrid(gridAlpha);
  drawAxes(gridAlpha);
  drawAxisLabels(gridAlpha);
  drawCarbonLine(lineProg, pointBase, labelBase);
  drawNppLine(lineProg, pointBase, labelBase);
  drawHover();
}

function drawGrid(alpha) {
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 1.0;
  ctx.setLineDash([4, 4]);

  for (let v = carbonRange.min; v <= carbonRange.max; v += carbonRange.step) {
    const y = yCarbon(v);
    ctx.beginPath(); ctx.moveTo(plotL, y); ctx.lineTo(plotR, y); ctx.stroke();
  }
  for (let i = 0; i < YEARS.length; i++) {
    const x = xOf(i);
    ctx.beginPath(); ctx.moveTo(x, plotT); ctx.lineTo(x, plotB); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function drawAxes(alpha) {
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = COLORS.axis;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(plotL, plotT); ctx.lineTo(plotL, plotB);
  ctx.lineTo(plotR, plotB); ctx.lineTo(plotR, plotT);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawAxisLabels(alpha) {
  ctx.globalAlpha = alpha;

  // 左轴碳排
  ctx.fillStyle = COLORS.carbon;
  ctx.font = FONT_AXIS;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let v = carbonRange.min; v <= carbonRange.max; v += carbonRange.step) {
    ctx.fillText(v.toLocaleString(), plotL - 10, yCarbon(v));
  }

  // 右轴NPP
  ctx.fillStyle = COLORS.npp;
  ctx.textAlign = 'left';
  for (let v = nppRange.min; v <= nppRange.max; v += nppRange.step) {
    ctx.fillText(v, plotR + 18, yNpp(v));
  }

  // X轴年份
  ctx.fillStyle = COLORS.text;
  ctx.font = FONT_AXIS;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (let i = 0; i < YEARS.length; i++) {
    ctx.fillText(YEARS[i], xOf(i), plotB + 10);
  }

  // X轴标题
  ctx.font = FONT_LABEL;
  ctx.fillStyle = COLORS.text;
  ctx.textBaseline = 'top';
  ctx.fillText('年份', plotL + (plotR - plotL) / 2, plotB + 36);

  // 左轴标题
  ctx.save();
  ctx.translate(12, plotT + (plotB - plotT) / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.font = FONT_LABEL;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = COLORS.carbon;
  ctx.fillText('碳排放密度（tCO₂/km²）', 0, 0);
  ctx.restore();

  // 右轴标题
  ctx.save();
  ctx.translate(plotR + 64, plotT + (plotB - plotT) / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.font = FONT_LABEL;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = COLORS.npp;
  ctx.fillText('NPP碳汇密度（tCO₂/km²/yr）', 0, 0);
  ctx.restore();

  ctx.globalAlpha = 1;
}

function drawCarbonLine(lineProg, pointBase, labelBase) {
  const pts = YEARS.map((_, i) => ({ x: xOf(i), y: yCarbon(carbonData[i]) }));

  // 填充面积
  ctx.fillStyle = COLORS.carbonFill;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, plotB);
  const lastI = Math.min(YEARS.length - 1, Math.floor(lineProg * (YEARS.length - 1)) + 1);
  for (let i = 0; i < YEARS.length; i++) {
    if (i > lastI) break;
    const segProg = clamp((lineProg * (YEARS.length - 1) - (i - 1)), 0, 1);
    const px = i === 0 ? pts[0].x : pts[i - 1].x + (pts[i].x - pts[i - 1].x) * segProg;
    const py = i === 0 ? pts[0].y : pts[i - 1].y + (pts[i].y - pts[i - 1].y) * segProg;
    ctx.lineTo(px, py);
  }
  const endX = pts[0].x + (pts[pts.length - 1].x - pts[0].x) * lineProg;
  ctx.lineTo(endX, plotB);
  ctx.closePath();
  ctx.fill();

  // 折线
  ctx.strokeStyle = COLORS.carbon;
  ctx.lineWidth = 3.6;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < YEARS.length; i++) {
    if (i > lastI) break;
    const segProg = clamp((lineProg * (YEARS.length - 1) - (i - 1)), 0, 1);
    const px = i === 0 ? pts[0].x : pts[i - 1].x + (pts[i].x - pts[i - 1].x) * segProg;
    const py = i === 0 ? pts[0].y : pts[i - 1].y + (pts[i].y - pts[i - 1].y) * segProg;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();

  // 数据点 + 标注（逐个弹入）
  for (let i = 0; i < YEARS.length; i++) {
    const px = pts[i].x;
    const py = pts[i].y;
    const pi = clamp((pointBase * YEARS.length - i) * 2, 0, 1);
    if (pi <= 0) continue;

    const scale = easeOutBack(pi);
    const alpha = easeOutCubic(pi);
    const sr = (i === hoverIdx ? 8.5 : 7) * scale;

    ctx.globalAlpha = alpha;
    drawHollowCircle(px, py, COLORS.carbon, sr);

    // 标注
    const li = clamp((labelBase * YEARS.length - i) * 2.5, 0, 1);
    if (li > 0) {
      ctx.globalAlpha = easeOutCubic(li);
      ctx.fillStyle = COLORS.carbon;
      ctx.font = FONT_POINT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(carbonData[i].toLocaleString(), px, py - 12);
    }
  }
  ctx.globalAlpha = 1;
}

function drawNppLine(lineProg, pointBase, labelBase) {
  const pts = YEARS.map((_, i) => ({ x: xOf(i), y: yNpp(nppData[i]) }));

  // 填充面积
  ctx.fillStyle = COLORS.nppFill;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, plotB);
  const lastI = Math.min(YEARS.length - 1, Math.floor(lineProg * (YEARS.length - 1)) + 1);
  for (let i = 0; i < YEARS.length; i++) {
    if (i > lastI) break;
    const segProg = clamp((lineProg * (YEARS.length - 1) - (i - 1)), 0, 1);
    const px = i === 0 ? pts[0].x : pts[i - 1].x + (pts[i].x - pts[i - 1].x) * segProg;
    const py = i === 0 ? pts[0].y : pts[i - 1].y + (pts[i].y - pts[i - 1].y) * segProg;
    ctx.lineTo(px, py);
  }
  const endX = pts[0].x + (pts[pts.length - 1].x - pts[0].x) * lineProg;
  ctx.lineTo(endX, plotB);
  ctx.closePath();
  ctx.fill();

  // 折线
  ctx.strokeStyle = COLORS.npp;
  ctx.lineWidth = 3.6;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < YEARS.length; i++) {
    if (i > lastI) break;
    const segProg = clamp((lineProg * (YEARS.length - 1) - (i - 1)), 0, 1);
    const px = i === 0 ? pts[0].x : pts[i - 1].x + (pts[i].x - pts[i - 1].x) * segProg;
    const py = i === 0 ? pts[0].y : pts[i - 1].y + (pts[i].y - pts[i - 1].y) * segProg;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();

  // 数据点 + 标注
  for (let i = 0; i < YEARS.length; i++) {
    const px = pts[i].x;
    const py = pts[i].y;
    const pi = clamp((pointBase * YEARS.length - i) * 2, 0, 1);
    if (pi <= 0) continue;

    const scale = easeOutBack(pi);
    const alpha = easeOutCubic(pi);
    const ss = (i === hoverIdx ? 8.5 : 7) * scale;

    ctx.globalAlpha = alpha;
    drawHollowSquare(px, py, COLORS.npp, ss);

    const li = clamp((labelBase * YEARS.length - i) * 2.5, 0, 1);
    if (li > 0) {
      ctx.globalAlpha = easeOutCubic(li);
      ctx.fillStyle = COLORS.npp;
      ctx.font = FONT_POINT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(nppData[i].toString(), px, py - 12);
    }
  }
  ctx.globalAlpha = 1;
}

function drawHollowCircle(cx, cy, color, r) {
  ctx.fillStyle = '#F5F0E8';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 3.0;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
}

function drawHollowSquare(cx, cy, color, size) {
  const s = size * 2;
  ctx.fillStyle = '#F5F0E8';
  ctx.fillRect(cx - size, cy - size, s, s);
  ctx.strokeStyle = color;
  ctx.lineWidth = 3.0;
  ctx.strokeRect(cx - size, cy - size, s, s);
}

function drawHover() {
  if (hoverIdx < 0) return;
  const x = xOf(hoverIdx);

  // 垂直虚线
  ctx.strokeStyle = COLORS.hoverLine;
  ctx.lineWidth = 0.8;
  ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(x, plotT); ctx.lineTo(x, plotB); ctx.stroke();
  ctx.setLineDash([]);

  // 光晕
  const cx = xOf(hoverIdx);
  drawHalo(cx, yCarbon(carbonData[hoverIdx]), COLORS.carbon);
  drawHalo(cx, yNpp(nppData[hoverIdx]), COLORS.npp);
}

function drawHalo(cx, cy, color) {
  const grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, 18);
  grad.addColorStop(0, color + '44');
  grad.addColorStop(1, color + '00');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI * 2); ctx.fill();
}

// ============================================================
// 鼠标交互
// ============================================================
function onMouseMove(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  let found = -1;
  let minDist = 70;
  for (let i = 0; i < YEARS.length; i++) {
    const x = xOf(i);
    const yc = yCarbon(carbonData[i]);
    const yn = yNpp(nppData[i]);
    const dc = Math.abs(mx - x);
    const dy = Math.min(Math.abs(my - yc), Math.abs(my - yn));
    const d = Math.sqrt(dc * dc + dy * dy);
    if (dc < minDist && d < minDist) { minDist = d; found = i; }
  }

  if (found !== hoverIdx) {
    hoverIdx = found;
    if (found >= 0) {
      tooltip.innerHTML =
        '<strong>' + YEARS[found] + '年</strong><br>' +
        '<span style="color:#FFB088">● 碳排放密度：' + carbonData[found].toLocaleString() + ' tCO₂/km²</span><br>' +
        '<span style="color:#88D088">■ NPP碳汇密度：' + nppData[found] + ' tCO₂/km²/yr</span>';
      tooltip.classList.add('show');
      let tx = xOf(found);
      let ty = Math.min(yCarbon(carbonData[found]), yNpp(nppData[found])) - 14;
      const tw = tooltip.offsetWidth || 200;
      if (tx < tw / 2 + 10) tx = tw / 2 + 10;
      if (tx > W - tw / 2 - 10) tx = W - tw / 2 - 10;
      if (ty < 30) ty = Math.max(yCarbon(carbonData[found]), yNpp(nppData[found])) + 40;
      tooltip.style.left = tx + 'px';
      tooltip.style.top = ty + 'px';
    } else {
      tooltip.classList.remove('show');
    }
    draw(1, 1, 1, 1);
  }
}

function onMouseLeave() {
  hoverIdx = -1;
  tooltip.classList.remove('show');
  draw(1, 1, 1, 1);
}
</script>
</body>
</html>
